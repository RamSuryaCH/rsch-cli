name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: '1.27.0'
  GORELEASER_VERSION: 'v2.8.2'
  GOVULNCHECK_VERSION: 'v1.1.4'
  GOSEC_VERSION: 'v2.22.8'

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Require an exact semantic-version tag
        shell: bash
        run: |
          set -euo pipefail
          tag=$(git describe --tags --exact-match)
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.go' -not -path './vendor/*' -print)
          test -z "$(gofmt -l ${files})"

      - name: Run vet and tests
        run: |
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} ./...

      - name: Run CLI and installer contract tests
        run: |
          ./scripts/e2e.sh
          ./scripts/test_install.sh
          bash scripts/test_release_archive_checks.sh

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      - name: Build release candidate without publishing
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=publish

      - name: Verify candidate archives and checksums
        run: ./scripts/test_release_archives.sh dist

  goreleaser:
    name: Build and publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Fetch tags
        run: git fetch --tags --prune

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Build and publish with GoReleaser
        uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          # The optional repository token preserves cross-repository Homebrew publishing;
          # the built-in token remains sufficient for the GitHub release itself.
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum -c checksums.txt

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: dist/rsch-source.spdx.json

      - name: Publish source SBOM as a release asset
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/rsch-source.spdx.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2.2.3
        with:
          subject-path: dist/**/*
